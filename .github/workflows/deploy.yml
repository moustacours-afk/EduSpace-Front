name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (unauthenticated, repo is public)
        run: git clone --depth 1 https://github.com/${{ github.repository }}.git . && git checkout ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@11

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm --filter @workspace/eduspace run build
        env:
          PORT: "3000"
          BASE_PATH: /EduSpace-Front/

      - name: Copy index.html as 404.html for SPA routing
        run: cp artifacts/eduspace/dist/public/index.html artifacts/eduspace/dist/public/404.html

      - name: Deploy to gh-pages branch
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          git config --global user.name "moustacours-afk"
          git config --global user.email "malkifouad901@gmail.com"
          cd artifacts/eduspace/dist/public
          git init
          git add -A
          git commit -m "Deploy: ${{ github.sha }}"
          git push --force "https://moustacours-afk:${DEPLOY_TOKEN}@github.com/${{ github.repository }}.git" HEAD:gh-pages
