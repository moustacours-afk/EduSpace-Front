name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@11

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm --filter @workspace/eduspace run build
        env:
          PORT: "3000"
          BASE_PATH: /EduSpace-Front/

      - name: Copy index.html as 404.html for SPA routing
        run: cp artifacts/eduspace/dist/public/index.html artifacts/eduspace/dist/public/404.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: artifacts/eduspace/dist/public
          branch: gh-pages
